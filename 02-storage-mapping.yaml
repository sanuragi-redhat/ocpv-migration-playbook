apiVersion: forklift.konveyor.io/v1beta1
kind: StorageMap
metadata:
  name: default-storage-mapping
  namespace: openshift-mtv
spec:
  map:
    - destination:
        storageClass: nfs
      source:
        id: 68f298f7-b9018cd1-5cdb-525400e02772
  provider:
